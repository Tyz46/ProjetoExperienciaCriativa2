<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil - ConsertaJa</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="../css/app.css?v=perfil-registros" rel="stylesheet">
</head>
<body>
<div class="site-shell">
    <nav class="navbar navbar-expand-lg bg-white shadow-sm">
        <div class="container">
            <a class="navbar-brand" href="../html/index.html">
                <span class="brand-mark"><i class="bi bi-tools"></i></span>ConsertaJa
            </a>

            <div class="ms-auto d-flex gap-2">
                <button class="btn btn-outline-danger" id="logoff">Sair</button>
            </div>
        </div>
    </nav>

    <main class="app-main container py-5">
        <div class="profile-card p-4 bg-white">
            <div class="card-body">
                <p class="section-kicker">Conta</p>
                <h2 class="page-title mb-4">Meu Perfil</h2>

                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Nome</label>
                        <input type="text" id="perfil_nome" class="form-control" readonly>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Usuario</label>
                        <input type="text" id="perfil_usuario" class="form-control" readonly>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Email</label>
                        <input type="text" id="perfil_email" class="form-control" readonly>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Telefone</label>
                        <input type="text" id="perfil_telefone" class="form-control" readonly>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Tipo de conta</label>
                        <input type="text" id="perfil_tipo" class="form-control" readonly>
                    </div>
                </div>
            </div>
        </div>

        <section class="section-card mt-4">
            <div class="mb-4">
                <p class="section-kicker mb-2">Seus registros</p>
                <h3 id="perfil_registros_titulo" class="h4 mb-1">Carregando seus registros</h3>
                <p id="perfil_registros_descricao" class="text-secondary mb-0">Os itens criados por esta conta aparecem abaixo das informacoes pessoais.</p>
            </div>

            <div id="lista_registros" class="row g-4"></div>
        </section>
    </main>

    <footer class="footer py-3 text-center">
        <p class="mb-0 text-secondary">© 2025 ConsertaJa. Todos os direitos reservados.</p>
    </footer>

    <script src="../js/logoff.js"></script>
    <script src="../js/valida_sessao.js?v=sessao"></script>
    <script src="../js/perfil.js?v=registros"></script>
</div>
</body>
</html>
